name: CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: |
          dotnet restore BanSach.csproj
          dotnet restore BanSach.Tests/BanSach.Tests.csproj

      - name: Build
        run: dotnet build BanSach.Tests/BanSach.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test BanSach.Tests/BanSach.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Publish
        run: dotnet publish BanSach.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: bansach-publish
          path: ./publish
          retention-days: 14
